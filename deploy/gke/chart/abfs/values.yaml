# Values for the ABFS chart. Names of Google Cloud resources must equal the names in the KCC
# overlay. Install the KCC objects first and wait until they are Ready, then
# `helm install --timeout 30m` without `--wait` (the pushers wait for the bootstrap Job,
# which is a post-install hook).

# Extra labels on every object.
commonLabels: {}

# Images, built by scripts/build-images.sh from one ABFS commit and pinned by
# digest. The chart refuses an empty digest unless allowTag is true (development only),
# which then uses <registry>/<name>:<tag>.
image:
  registry: europe-west4-docker.pkg.dev/example-project/abfs
  pullPolicy: IfNotPresent
  allowTag: false
  # Tag used only with allowTag; empty means the chart appVersion.
  tag: ""
  server:
    name: abfs-server
    digest: ""
  pusher:
    name: abfs-pusher
    digest: ""
  client:
    name: abfs-client
    digest: ""
  casfsLoader:
    name: casfs-loader
    digest: ""

# Backend names. They must equal the KCC names in both backend modes.
backend:
  project: ""
  spannerInstance: ""
  spannerDatabase: cas
  bigtableInstance: ""
  # Empty uses the instance default profile, which must use single-cluster routing.
  bigtableAppProfile: ""
  bucket: ""
  # Zone of the Bigtable cluster. It is the default primary zone of the CI and server
  # classes (computeClasses.zones.primary).
  zone: ""

# Namespaces. The release namespace (abfs) holds the server, pushers and the bootstrap Job;
# the KCC base creates it, with its project annotation and Pod Security level baseline.
# ci.namespace holds the CI node workloads and the build pods. With createCi the chart
# creates it with Pod Security level privileged; set it to false when the namespace is
# managed elsewhere.
namespaces:
  createCi: true

server:
  enabled: true
  # GSA bound to the abfs-server KSA through Workload Identity. Empty means
  # abfs-server@<backend.project>.iam.gserviceaccount.com.
  gcpServiceAccount: ""
  # max is a sizing input: the Gateway request rate of the peak over what one replica
  # serves, plus a margin (docs/sizing.md).
  replicas:
    min: 3
    max: 10
  hpa:
    enabled: true
    cpuTarget: 60
    # Scale-down only; scale-up keeps the Kubernetes HPA default. A replica that stops
    # takes its filled caches with it, so the HPA waits this long after the load drops
    # and then removes at most one replica per scaleDownPeriodSeconds.
    scaleDownStabilizationSeconds: 1800
    scaleDownPeriodSeconds: 300
  # Entry counts, not bytes: headers about 180 B each, contents up to about 49 KB each.
  # The render fails when both bounds plus 6 GiB (7 GiB with gc.enabled) exceed
  # memoryLimit.
  caches:
    headers: 100000000
    contents: 400000
  # Memory request and limit. GOMEMLIMIT is set to 90 % of it.
  memoryLimit: 48Gi
  # CPU request; no CPU limit. GOMAXPROCS follows it. 14 fits one replica on a 16-vCPU
  # node next to the GKE reservation and the system DaemonSets; 16 would never fit one.
  cpuRequest: 14
  # CPU only. Off gives recommendations; Recreate applies them by recreating pods.
  # In-place resizing is not offered: GOMAXPROCS is fixed when the container starts.
  vpa:
    enabled: true
    mode: "Off"
    # Preview, GKE 1.36.3-gke.1630000 or later: HPA and VPA share the CPU request.
    # Recreate with the HPA on needs it: a plain VPA on CPU next to a CPU HPA makes the
    # two fight, so the render fails on that combination.
    hpaRightsizing: false
    minCpu: 12
    maxCpu: 32
  drainDelay: 15s
  healthProbeInterval: 10s
  shutdownTimeout: 25s
  logSampleRate: 0.01
  gc:
    enabled: false
  # --links-content: objects above thresholdBytes go to the client as signed Cloud Storage
  # URLs, so their bytes skip the Gateway. Needs the KCC component links-content, which
  # lets the server's service account sign as itself (docs/sizing.md, "Gateway").
  linksContent:
    enabled: false
    thresholdBytes: 1048576
  extraArgs: []
  preStopSleepSeconds: 120
  # preStop, then the server's longest stop after SIGTERM, then a margin: 120 s +
  # 105 s (15 s drain, 25 s graceful gRPC stop, with gc 20 s touch drain and 30 s
  # heartbeat row delete, 15 s telemetry flush) + 15 s = 240 s.
  terminationGracePeriodSeconds: 240
  minReadySeconds: 60
  probes:
    # TCP on 50051 until the port opens; liveness and readiness start after it passes.
    # periodSeconds x failureThreshold is the time a start may take, 5 minutes: setup of
    # the backend clients and the resource check, and with gc the first heartbeat, which
    # the server retries for up to a minute. Raise it when the server log shows slower
    # starts.
    startup:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 6

# The garbage collector's cycle, `abfs server gcp gc run`, as the CronJob abfs-gc-collector
# under the server's service account (docs/runbook.md, "Garbage collection"). Needs
# server.gc.enabled.
gcCollector:
  enabled: false
  # dry-run, condemn or delete. Run each mode clean before the next.
  mode: dry-run
  # UTC, at a low-write hour. The alerts assume one cycle a day.
  schedule: "0 2 * * *"
  # true for `gc undo` and `gc backfill`; then wait for or delete the active Job.
  suspend: false
  # The collector's app profile; must equal the one of components/gc.
  bigtableAppProfile: abfs-gc
  # Delete mode only, as --delete-types; required there. Widen from the top of the graph
  # down: commit, project-status and build types, then trees and deep trees, then blobs.
  deleteTypes: []
  # Memory request and limit. GOMEMLIMIT is 90 % of it. At least 1.4 x the report's
  # keys_bytes + edges_bytes + map_rows_bytes; 24Gi covers about 10^8 objects.
  memoryLimit: 24Gi
  # CPU request; no CPU limit. GOMAXPROCS follows it.
  cpuRequest: 4
  # activeDeadlineSeconds of each Job. The window of the GC alerts grows with it.
  deadlineSeconds: 14400
  # Placement, as for bootstrap.computeClass. The server class runs in the Bigtable zone.
  computeClass: abfs-server
  nodeSelector: {}
  tolerations: []

gateway:
  className: gke-l7-rilb
  # Name of the KCC ComputeAddress (purpose SHARED_LOADBALANCER_VIP).
  addressName: abfs-gateway
  # IP of that address. Pushers, cacheman and build pods use <vip>:50051.
  vip: ""
  # Connections of each cacheman and pusher to <vip>:50051. The client spreads object keys
  # over them, and each connection is served by one Gateway proxy (docs/sizing.md).
  connections: 4
  timeoutSec: 600
  drainingTimeoutSec: 60
  logging:
    enabled: true
    # Out of 1,000,000.
    sampleRate: 1000
  allowGlobalAccess: false

pusher:
  enabled: true
  # Fixed after the seed. A change re-shards the pool (hours of re-clone). Never scale
  # the StatefulSet by hand: the pool is rendered from this value.
  count: 3
  namePrefix: abfs-pusher
  # HTTP /info port of each pusher (defaults.port in the pool config).
  port: 9998
  dataDisk:
    size: 1Ti
    storageClass: abfs-hyperdisk-balanced
    # Create the StorageClass above (Hyperdisk Balanced, WaitForFirstConsumer).
    createStorageClass: true
  # seed: class abfs-pusher-seed with seedResources. steady: class abfs-pusher-steady with
  # steadyResources and the memory VPA. Switch back to seed for a re-shard, a lost PVC or a
  # large new branch.
  phase: seed
  seedResources:
    requests:
      cpu: 28
      memory: 200Gi
    limits:
      memory: 200Gi
  # A starting value; the VPA adjusts the memory. 7 CPU fits an 8-vCPU node next to
  # the GKE reservation and the system DaemonSets.
  steadyResources:
    requests:
      cpu: 7
      memory: 32Gi
    limits:
      memory: 32Gi
  # Steady phase only, memory only. Initial applies the recommendation only when a pusher
  # pod is created: a container that was OOMKilled restarts in the same pod at the old
  # limit, so delete the pod (docs/configuration.md). Recreate also evicts on drift.
  # InPlaceOrRecreate (Preview, GKE 1.34.0-gke.2201000 or later) resizes the memory in
  # place and raises it after an OOM kill.
  vpa:
    mode: Initial
    minMemory: 16Gi
    maxMemory: 200Gi
  terminationGracePeriodSeconds: 90
  gerrit:
    # Secret in the release namespace with key .netrc, and .gitcookies if cookies is true.
    secretName: gerrit-credentials
    cookies: false
  pool:
    manifest:
      # For example https://gerrit.example.com/a/platform/manifest
      url: ""
      # The pool registers the manifest under server/project: server defaults to the host
      # of url (port included), project to its path. Set project when url has a path
      # prefix such as /a/. The bootstrap Job and cacheman give the clients the same
      # values as manifest-server, manifest-scheme and manifest-project-name, also
      # with pusher.enabled false. A URL without a scheme gets https://.
      project: ""
      server: ""
      checkInterval: ""
    branchFiles:
      - branch: main
        file: default.xml
    fetchRefSpec:
      - +refs/heads/*:refs/heads/*
      - +refs/tags/*:refs/tags/*
    # Further FetchConfig keys for every project (workers, push-interval, ...).
    projectDefaults: {}
    # Per-project overrides, for example the manifest project with all its branches.
    overrides: []
    # GitPusherDefaultsConfig keys (max-remote-pushes, max-projects-syncs,
    # max-memory-usage). port comes from pusher.port.
    defaults: {}

bootstrap:
  enabled: true
  deadlineSeconds: 1500
  backoffLimit: 3
  # Written to config:clients/configs. Never disable-tls, root-ca-file or
  # partial-clone here. manifest-server, manifest-scheme and manifest-project-name come
  # from pusher.pool.manifest; set them here only to override that.
  clientConfig:
    sync.auto-setup: true
    force-workspaces: true
    git-prefetching: false
    ignore-soong-env-avail: true
  # Seed the patched repo tool (refs/heads/stable-abfs of gerrit.googlesource.com/git-repo)
  # when the store has none, as on a new backend. Every mount -b fails without it. The Job
  # checks the ref first and skips the seed when it exists, so an existing backend is left
  # alone. The seed needs egress to gerrit.googlesource.com. A failed check or seed fails
  # the hook, and with it helm install or upgrade; the Job log then names this value.
  repoSetup:
    enabled: true
  # The Job runs on a node of this class (selector and toleration added). The system pool
  # often has a node account that cannot pull from Artifact Registry; the class nodes use
  # computeClasses.nodeServiceAccount, which can. Empty leaves placement to nodeSelector
  # and tolerations.
  computeClass: abfs-server
  nodeSelector: {}
  tolerations: []

ci:
  enabled: true
  namespace: abfs-ci
  uid: 1000
  gid: 1000
  hostCacheDir: /var/lib/abfs
  # Build pods fail after this, so the CI system retries them on another node.
  waitForCasfsTimeout: 15m
  # Disk of one build pod: the ephemeral-storage request every build pod sets, for the
  # outputs it writes into the node cache. No limit: the outputs live in the hostPath,
  # which kubelet does not count (docs/ci-job.md, "Node disk").
  buildDisk: 400Gi
  cacheman:
    # Disk reserved for the node cache, as the ephemeral-storage request of cacheman.
    # Its eviction threshold is 90 % of it. The render fails when this plus buildDisk exceeds
    # the allocatable ephemeral storage of computeClasses.ci.bootDiskGb.
    cacheDisk: 400Gi
    fsyncObjects: true
    # Directory of the static tool set in the abfs-client image.
    toolDir: /opt/abfs/bin
    # No CPU limit and no GOMAXPROCS: the one cacheman of a node serves every build pod
    # there, so it may use all cores. The request is a scheduling floor only.
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        memory: 8Gi
  casfs:
    # image: COS nodes; the node image ships casfs (COS 133 build 44-193 or later ships
    # 0.1.24), the loader loads and checks it. daemonset: Ubuntu nodes; the loader builds
    # casfs from the source in its image on each node.
    provider: image
    # Build pods per node plus 2 for remounts. Read-only after load.
    maxMounts: 4
    # Kernel slab per active workspace. An active full-tree workspace holds a few GB of
    # casfs slab; 6 keeps a margin.
    mountGbPerWorkspace: 6
    # Upper bound: maxMounts * mountGbPerWorkspace must fit in this share of MemTotal.
    maxRamShare: 0.4
    # Interface the client needs: implemented >= this, required <= this.
    interfaceVersion: 1.5.0
    source:
      # Source tree in the casfs-loader image.
      path: /usr/src/casfs
      commit: c946f8e
      # Module version the loader builds and expects (prefix match) with provider
      # daemonset; empty skips the check. Provider image checks the interface only.
      version: 0.1.23
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 2Gi
  # Not implemented in this chart version.
  localSsd:
    enabled: false
  # Standby CapacityBuffer, GKE 1.37.1-gke.3020000 or later: replicas suspended CI nodes,
  # each shaped for one build pod (ci.exampleJob.resources and ci.buildDisk), that GKE
  # resumes before it creates new nodes. Needs computeClasses.ci.machineTypes, shapes of at
  # most 208 GB memory; the render fails without them (docs/sizing.md, "Standby buffer").
  capacityBuffer:
    enabled: false
    replicas: 0
    # Time GKE gives a new buffer node to start its DaemonSets before it suspends it.
    initTime: 5m
    # Age at which GKE replaces a suspended node, at most 120h.
    refresh: 24h
  exampleJob:
    enabled: false
    # Build image of the customer's CI; it needs bash and the Android build host tools.
    image: ""
    branch: main
    target: aosp_cf_x86_64_phone-trunk_staging-userdebug
    # Runs in bash in the mounted tree after set +u, with -e and pipefail (docs/ci-job.md).
    command: "source build/envsetup.sh && lunch \"$TARGET\" && m"
    # activeDeadlineSeconds of the Job, retries included: 12 hours.
    deadlineSeconds: 43200
    # Fits one pod on a 32-vCPU, 128 GB node of the class floor: the node's vCPUs minus
    # the GKE reservation, cacheman, the loader and the GKE system DaemonSets (docs/ci-job.md).
    # The chart adds the ephemeral-storage request ci.buildDisk.
    resources:
      requests:
        cpu: "28"
        memory: 80Gi
      limits:
        memory: 80Gi

computeClasses:
  enabled: true
  # Node service account of every class (KCC base).
  nodeServiceAccount: ""
  # Image streaming on the nodes of every class. Needs the Container File System API and
  # roles/serviceusage.serviceUsageConsumer for the node account (KCC base). A change
  # applies to new node pools only.
  imageStreaming: true
  # Zones of the CI and server nodes. GKE tries the primary zone first and the fallback
  # zones only when the primary zone lacks capacity (any of them, locationPolicy ANY).
  # primary empty means backend.zone, the Bigtable zone; fallback empty means the primary
  # zone only. Zones of the cluster's region; fallback must not hold primary.
  zones:
    primary: ""
    fallback: []
  ci:
    families: [n4, n4d, c4d, c4]
    # Exact machine types in place of families, in fallback order. Required with
    # ci.capacityBuffer, which supports no node over 208 GB of memory. No Local SSD
    # shapes (-lssd types): the render fails.
    machineTypes: []
    minCores: 32
    minMemoryGb: 120
    # GiB. Holds the node cache and the build outputs; it also sets the default Hyperdisk
    # IOPS and throughput. 1100 fits ci.cacheman.cacheDisk plus one ci.buildDisk; two
    # builds per node need 1600 (docs/ci-job.md, "Node disk").
    bootDiskGb: 1100
    # Spot rules before the on-demand ones. Only if the CI retries preempted builds.
    spot: false
    # How long an empty CI node stays. A node that stays keeps its object cache; its map
    # entries expire 6 to 8 hours after they were written, whatever the delay (docs/sizing.md).
    consolidationDelayMinutes: 30
    # Empty keeps the GKE default.
    consolidationThreshold: ""
    activeMigration: false
    # gcloud-created pools with provisioned boot disk IOPS, tried first.
    nodepools: []
    # Preview, GKE 1.36.2-gke.2064000 or later: a CapacityQuota that caps the nodes of the
    # class, and with cpu also their vCPUs. The cluster autoscaler enforces it, and not
    # strictly. Without it the project's Compute Engine quota is the only bound.
    capacityQuota:
      enabled: false
      # Required when enabled.
      nodes: 0
      # Empty sets no CPU limit.
      cpu: ""
  server:
    families: [n4, n4d, c4d, c4]
    # Moves servers back to the primary zone and the first family when capacity returns.
    activeMigration: true
  pusherSeed:
    families: [n4, n4d, c4d, c4]
    minCores: 32
    minMemoryGb: 240
  pusherSteady:
    families: [n4, n4d, c4d, c4]

otel:
  enabled: true
  endpoint: http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317
  protocol: grpc

pdb:
  enabled: true

# Inert without Dataplane V2.
networkPolicy:
  enabled: true
  # Proxy-only subnet of the region (REGIONAL_MANAGED_PROXY).
  proxyOnlySubnetCidr: ""
  healthCheckCidrs:
    - 35.191.0.0/16

# Managed Service for Prometheus rules. Off by default: the pusher pool rules and the GC
# collector rules (Rules object abfs-gc-collector, with gcCollector.enabled) read the OTLP
# metrics the managed collector stores, which is not checked on a cluster yet. The node
# disk and pusher restart rules read GKE system metrics through a GlobalRules object.
alerts:
  enabled: false
  for: 30m
  # Name of this GKE cluster, required with enabled. The GlobalRules object filters on
  # it; without the filter it would match every cluster in the project's metrics scope.
  clusterName: ""

tests:
  enabled: true
  # Also check the tools on a CI node. This can create a CI node.
  ciTools: true
  # Placement of the server health test, as for bootstrap.computeClass. The CI tools test
  # always runs on the abfs-ci class.
  computeClass: abfs-server
  nodeSelector: {}
  tolerations: []
