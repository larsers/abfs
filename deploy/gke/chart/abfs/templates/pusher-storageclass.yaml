{{- if and .Values.pusher.enabled .Values.pusher.dataDisk.createStorageClass }}
# Hyperdisk Balanced for the pusher PVCs; it attaches to all four families. The disk is
# created in the zone of the pod's first node.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.pusher.dataDisk.storageClass }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
provisioner: pd.csi.storage.gke.io
parameters:
  type: hyperdisk-balanced
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
{{- end }}
