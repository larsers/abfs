{{- if and .Values.ci.enabled .Values.namespaces.createCi }}
# The CI namespace. The casfs loader (privileged, host root) and the build pods
# (privileged, for casfs) need the privileged level. The release namespace comes from the
# KCC base. Kept on uninstall, so build pods of the CI system are not deleted with it.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.ci.namespace }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
