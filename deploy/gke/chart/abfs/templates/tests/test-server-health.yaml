{{- if and .Values.tests.enabled .Values.server.enabled }}
{{- $srv := include "abfs.server.service" . }}
{{- $vip := include "abfs.vip" . }}
# gRPC health of the server through the ClusterIP Service and through the Gateway VIP.
apiVersion: v1
kind: Pod
metadata:
  name: abfs-test-server-health
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    {{- include "abfs.selectorLabels" "test" | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with include "abfs.placement" (dict "root" . "cfg" .Values.tests "what" "tests") | trim }}
  {{- . | nindent 2 }}
  {{- end }}
  containers:
    - name: health
      image: {{ include "abfs.image" (dict "root" . "image" "client") }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - /bin/sh
        - -c
        - |
          set -e
          for a in {{ $srv }} {{ $vip }}; do
            abfs --remote-servers "$a" --tunnel-ports 0 --disable-tls --auth-type none test-client health-check
            echo "OK: $a"
          done
      env:
        - name: HOME
          value: /tmp
        {{- include "abfs.userEnv" . | nindent 8 }}
      securityContext:
        {{- include "abfs.restrictedSecurityContext" (dict "uid" .Values.ci.uid "gid" .Values.ci.gid) | nindent 8 }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
