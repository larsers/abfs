{{- include "abfs.validate" . }}
{{- if .Values.server.enabled }}
{{- $s := .Values.server }}
{{- $mem := include "abfs.bytes" $s.memoryLimit | int64 }}
# Stateless GCP-backed server. Readiness follows gRPC health, which turns NOT_SERVING on a
# backend outage and while draining; liveness is TCP only, so a backend outage does not
# restart every replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "abfs.server.name" . }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    {{- include "abfs.selectorLabels" "server" | nindent 4 }}
spec:
  {{- if not $s.hpa.enabled }}
  replicas: {{ $s.replicas.min }}
  {{- end }}
  minReadySeconds: {{ $s.minReadySeconds }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "abfs.selectorLabels" "server" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "abfs.labels" . | nindent 8 }}
        {{- include "abfs.selectorLabels" "server" | nindent 8 }}
    spec:
      serviceAccountName: {{ include "abfs.server.name" . }}
      nodeSelector:
        cloud.google.com/compute-class: abfs-server
      terminationGracePeriodSeconds: {{ $s.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: abfs-server
          image: {{ include "abfs.image" (dict "root" . "image" "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The binary is PID 1 and gets SIGTERM itself.
          command:
            - abfs-server
            - --port={{ include "abfs.server.port" . }}
            - --http-host=127.0.0.1
            - --http-port=8051
            - --log-sample-rate={{ $s.logSampleRate }}
            - --drain-delay={{ $s.drainDelay }}
            - --shutdown-timeout={{ $s.shutdownTimeout }}
            - --health-probe-interval={{ $s.healthProbeInterval }}
            - --headers-cache={{ int64 $s.caches.headers }}
            - --contents-cache={{ int64 $s.caches.contents }}
            - --project={{ .Values.backend.project }}
            - --instance={{ .Values.backend.spannerInstance }}
            - --db={{ .Values.backend.spannerDatabase }}
            - --bt-instance={{ .Values.backend.bigtableInstance }}
            {{- with .Values.backend.bigtableAppProfile }}
            - --bt-app-profile={{ . }}
            {{- end }}
            - --bucket={{ .Values.backend.bucket }}
            {{- if $s.gc.enabled }}
            - --gc
            {{- end }}
            {{- range $s.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- include "abfs.gomaxprocsEnv" . | nindent 12 }}
            - name: GOMEMLIMIT
              value: {{ div (mul $mem 9) 10 | quote }}
            - name: HOME
              value: /tmp
            {{- include "abfs.otelEnv" (dict "root" . "queue" 32768 "traces" true) | trim | nindent 12 }}
          ports:
            - name: grpc
              containerPort: {{ include "abfs.server.port" . }}
          readinessProbe:
            {{- include "abfs.probe" (dict "cfg" $s.probes.readiness "type" "grpc" "port" (include "abfs.server.port" . | int)) | trim | nindent 12 }}
          livenessProbe:
            {{- include "abfs.probe" (dict "cfg" $s.probes.liveness "type" "tcpSocket" "port" (include "abfs.server.port" . | int)) | trim | nindent 12 }}
          # The Gateway drains for gateway.drainingTimeoutSec after the endpoint goes away;
          # the server keeps serving through that before it gets SIGTERM.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $s.preStopSleepSeconds }}
          resources:
            requests:
              cpu: {{ $s.cpuRequest | quote }}
              memory: {{ $s.memoryLimit | quote }}
            limits:
              memory: {{ $s.memoryLimit | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
