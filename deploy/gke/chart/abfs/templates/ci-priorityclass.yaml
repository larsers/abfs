{{- if .Values.ci.enabled }}
# Priority of cacheman and the casfs loader. No build runs on a CI node without them, and
# the scheduler holds no room for a DaemonSet pod: build pods that bind first, or a
# cacheman pod recreated under running builds, could leave cacheman Pending on its disk
# request. With this class the scheduler preempts build pods for them. 1000000000 is the
# highest value GKE allows for a class of your own; at a scale-down the cluster autoscaler
# evicts pods of that priority after all others, so cacheman outlives the builds. Build
# pods need a lower priority than this class.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "abfs.ciPriorityClass" . }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
value: 1000000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: ABFS cacheman and casfs loader on CI nodes. Preempts build pods.
{{- end }}
