{{- if .Values.bootstrap.enabled }}
{{- $p := .Values.pusher }}
# The two configs the bootstrap Job writes into the store. The pool is rendered from
# pusher.count, the same value as the StatefulSet replicas, so the two cannot drift in Helm.
# The client config carries the manifest server and project of the pool, so clients find
# the manifest ref the pushers write.
apiVersion: v1
kind: ConfigMap
metadata:
  name: abfs-bootstrap-config
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    {{- include "abfs.selectorLabels" "bootstrap" | nindent 4 }}
data:
  {{- if $p.enabled }}
  {{- if not $p.pool.manifest.url }}
  {{- fail "pusher.pool.manifest.url is required when pusher.enabled is true" }}
  {{- end }}
  git-pusher-default: |
    name: default
    pushers-count: {{ $p.count }}
    defaults:
      {{- toYaml (merge (dict "port" $p.port) $p.pool.defaults) | nindent 6 }}
    pushers:
      {{- range $i := until (int $p.count) }}
      - name: {{ $p.namePrefix }}-{{ $i }}
      {{- end }}
    repos:
      - manifest:
          url: {{ $p.pool.manifest.url }}
          {{- with $p.pool.manifest.project }}
          project: {{ . }}
          {{- end }}
          {{- with $p.pool.manifest.server }}
          server: {{ . }}
          {{- end }}
          {{- with $p.pool.manifest.checkInterval }}
          check-interval: {{ . }}
          {{- end }}
          files:
            {{- toYaml $p.pool.branchFiles | nindent 12 }}
        project-defaults:
          fetch-ref-spec:
            {{- toYaml $p.pool.fetchRefSpec | nindent 12 }}
          {{- with $p.pool.projectDefaults }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with $p.pool.overrides }}
        overrides:
          {{- toYaml . | nindent 10 }}
        {{- end }}
  {{- end }}
  {{- $client := merge (fromYaml (include "abfs.clientManifest" .)) (deepCopy .Values.bootstrap.clientConfig) }}
  clients-configs: |
    - select:
      config:
        {{- toYaml $client | nindent 8 }}
{{- end }}
