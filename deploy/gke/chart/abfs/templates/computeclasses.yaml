{{- if .Values.computeClasses.enabled }}
{{- $cc := .Values.computeClasses }}
{{- if not $cc.nodeServiceAccount }}
{{- fail "computeClasses.nodeServiceAccount is required: the node service account of the KCC base" }}
{{- end }}
# Custom ComputeClasses: a fallback order over four machine families per role, node pool
# auto-creation, and nodes that follow the pod requests. Pods select a class with the
# cloud.google.com/compute-class node selector; GKE taints the class nodes and adds the
# toleration to those pods. Image streaming follows computeClasses.imageStreaming on the
# nodes GKE creates; a change applies to new node pools only. Every class turns secure boot
# and integrity monitoring on, except the CI class with ci.casfs.provider daemonset; the
# org policy constraints/compute.requireShieldedVm requires both and the vTPM of Shielded
# GKE Nodes.
{{- if .Values.ci.enabled }}
---
# CI build nodes: COS with secure boot on and the casfs module of the node image, or Ubuntu
# with secure boot off for the module the loader builds. The shielded instance settings
# apply to new CI node pools only. Upgrades of existing pools are held back, because a new
# node image or kernel can change or drop the module.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: abfs-ci
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
spec:
  priorities:
    {{- with $cc.ci.nodepools }}
    - nodepools:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- $spots := list }}
    {{- if $cc.ci.spot }}{{ $spots = append $spots true }}{{ end }}
    {{- $spots = append $spots false }}
    {{- range $spot := $spots }}
    {{- range $f := $cc.ci.families }}
    - machineFamily: {{ $f }}
      minCores: {{ $cc.ci.minCores }}
      minMemoryGb: {{ $cc.ci.minMemoryGb }}
      spot: {{ $spot }}
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: {{ $cc.ci.bootDiskGb }}
    {{- end }}
    {{- end }}
  nodePoolConfig:
    imageType: {{ ternary "ubuntu_containerd" "cos_containerd" (eq .Values.ci.casfs.provider "daemonset") }}
    serviceAccount: {{ $cc.nodeServiceAccount }}
    imageStreaming:
      enabled: {{ $cc.imageStreaming }}
    maintenanceExclusion: UNTIL_END_OF_SUPPORT
  nodePoolAutoCreation:
    enabled: true
    shieldedInstanceConfig:
      enableSecureBoot: {{ ne .Values.ci.casfs.provider "daemonset" }}
      enableIntegrityMonitoring: true
  autoscalingPolicy:
    consolidationDelayMinutes: {{ $cc.ci.consolidationDelayMinutes }}
    {{- if ne (toString $cc.ci.consolidationThreshold) "" }}
    consolidationThreshold: {{ $cc.ci.consolidationThreshold }}
    {{- end }}
  activeMigration:
    optimizeRulePriority: {{ $cc.ci.activeMigration }}
  whenUnsatisfiable: DoNotScaleUp
{{- with $cc.ci.capacityQuota }}
{{- if .enabled }}
{{- if lt (int .nodes) 1 }}
{{- fail "computeClasses.ci.capacityQuota.nodes is required with capacityQuota.enabled: the most CI nodes the autoscaler may create" }}
{{- end }}
---
# Preview: caps the CI nodes. Only the cluster autoscaler enforces it, and not strictly; it
# counts every node with the class label, hand-made pools included.
apiVersion: autoscaling.x-k8s.io/v1beta1
kind: CapacityQuota
metadata:
  name: {{ $.Release.Name }}-ci
  labels:
    {{- include "abfs.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      cloud.google.com/compute-class: abfs-ci
  limits:
    resources:
      nodes: {{ int .nodes }}
      {{- if ne (toString .cpu) "" }}
      cpu: {{ int .cpu }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.server.enabled }}
---
# Servers: the zone of the Bigtable cluster, never Spot.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: abfs-server
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
spec:
  priorities:
    {{- $zone := $cc.server.zone | default .Values.backend.zone }}
    {{- range $f := $cc.server.families }}
    - machineFamily: {{ $f }}
      spot: false
      storage:
        bootDiskType: hyperdisk-balanced
      location:
        zones: [{{ $zone | quote }}]
    {{- end }}
  nodePoolConfig:
    imageType: cos_containerd
    serviceAccount: {{ $cc.nodeServiceAccount }}
    imageStreaming:
      enabled: {{ $cc.imageStreaming }}
  nodePoolAutoCreation:
    enabled: true
    shieldedInstanceConfig:
      enableSecureBoot: true
      enableIntegrityMonitoring: true
  activeMigration:
    optimizeRulePriority: {{ $cc.server.activeMigration }}
  whenUnsatisfiable: DoNotScaleUp
{{- end }}
{{- if .Values.pusher.enabled }}
---
# Pushers during the seed: highmem shapes for the largest repository.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: abfs-pusher-seed
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
spec:
  priorities:
    {{- range $f := $cc.pusherSeed.families }}
    - machineFamily: {{ $f }}
      minCores: {{ $cc.pusherSeed.minCores }}
      minMemoryGb: {{ $cc.pusherSeed.minMemoryGb }}
      spot: false
      storage:
        bootDiskType: hyperdisk-balanced
    {{- end }}
  nodePoolConfig:
    imageType: cos_containerd
    serviceAccount: {{ $cc.nodeServiceAccount }}
    imageStreaming:
      enabled: {{ $cc.imageStreaming }}
  nodePoolAutoCreation:
    enabled: true
    shieldedInstanceConfig:
      enableSecureBoot: true
      enableIntegrityMonitoring: true
  activeMigration:
    optimizeRulePriority: false
  whenUnsatisfiable: DoNotScaleUp
---
# Pushers after the seed: nodes follow the steady requests.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: abfs-pusher-steady
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
spec:
  priorities:
    {{- range $f := $cc.pusherSteady.families }}
    - machineFamily: {{ $f }}
      spot: false
      storage:
        bootDiskType: hyperdisk-balanced
    {{- end }}
  nodePoolConfig:
    imageType: cos_containerd
    serviceAccount: {{ $cc.nodeServiceAccount }}
    imageStreaming:
      enabled: {{ $cc.imageStreaming }}
  nodePoolAutoCreation:
    enabled: true
    shieldedInstanceConfig:
      enableSecureBoot: true
      enableIntegrityMonitoring: true
  activeMigration:
    optimizeRulePriority: false
  whenUnsatisfiable: DoNotScaleUp
{{- end }}
{{- end }}
