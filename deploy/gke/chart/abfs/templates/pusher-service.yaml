{{- if .Values.pusher.enabled }}
# Headless Service for stable pod names; the port is the pusher /info endpoint.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "abfs.pusher.name" . }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    {{- include "abfs.selectorLabels" "pusher" | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "abfs.selectorLabels" "pusher" | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.pusher.port }}
      targetPort: http
{{- end }}
