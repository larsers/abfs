{{- if and .Values.server.enabled .Values.server.vpa.enabled }}
{{- $v := .Values.server.vpa }}
{{- if not (has $v.mode (list "Off" "Recreate")) }}
{{- fail "server.vpa.mode must be Off or Recreate: GOMAXPROCS does not follow an in-place CPU change" }}
{{- end }}
{{- if and (eq $v.mode "Recreate") .Values.server.hpa.enabled (not $v.hpaRightsizing) }}
{{- fail "server.vpa.mode Recreate next to the CPU HPA makes the two autoscalers fight over the CPU request: set server.vpa.hpaRightsizing=true, or use server.vpa.mode Off" }}
{{- end }}
# CPU only: memory is set by the cache bounds, which a VPA would undercut while the caches
# fill.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "abfs.server.name" . }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    {{- include "abfs.selectorLabels" "server" | nindent 4 }}
  {{- if $v.hpaRightsizing }}
  annotations:
    gke.io/autoscaling-hpa-rightsizing-mode: "gke-hpa-rightsizing-mode-policy"
  {{- end }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "abfs.server.name" . }}
  updatePolicy:
    updateMode: {{ $v.mode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: abfs-server
        controlledResources: ["cpu"]
        minAllowed:
          cpu: {{ $v.minCpu | quote }}
        maxAllowed:
          cpu: {{ $v.maxCpu | quote }}
{{- end }}
