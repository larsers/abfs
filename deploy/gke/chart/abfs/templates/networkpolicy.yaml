{{- if and .Values.networkPolicy.enabled .Values.server.enabled }}
{{- $n := .Values.networkPolicy }}
{{- if not $n.proxyOnlySubnetCidr }}
{{- fail "networkPolicy.proxyOnlySubnetCidr is required when networkPolicy.enabled is true" }}
{{- end }}
# Server ingress: the Gateway proxies (proxy-only subnet), the load balancer health checks,
# the bootstrap Job and the Helm test. Egress stays open (Spanner, Bigtable, Cloud Storage,
# the telemetry collector). Inert without Dataplane V2.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "abfs.server.name" . }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    {{- include "abfs.selectorLabels" "server" | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "abfs.selectorLabels" "server" | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ $n.proxyOnlySubnetCidr }}
        {{- range $n.healthCheckCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["abfs"]
              - key: app.kubernetes.io/component
                operator: In
                values: ["bootstrap", "test"]
      ports:
        - protocol: TCP
          port: {{ include "abfs.server.port" . }}
{{- end }}
