{{- if .Values.ci.enabled }}
# Recommendations only: Off never changes a cacheman pod, which must not restart under
# running builds. Memory only, so ci.cacheman.resources can be set from a measured value
# (docs/configuration.md, "Right-sizing").
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: abfs-cacheman
  namespace: {{ .Values.ci.namespace }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    {{- include "abfs.selectorLabels" "cacheman" | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: abfs-cacheman
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: cacheman
        controlledResources: ["memory"]
{{- end }}
