{{- if and .Values.pusher.enabled (eq .Values.pusher.phase "steady") }}
{{- $v := .Values.pusher.vpa }}
{{- if not (has $v.mode (list "Initial" "Recreate")) }}
{{- fail "pusher.vpa.mode must be Initial or Recreate" }}
{{- end }}
# Steady phase only, so the history never holds the seed peak. Memory only: the CPU request
# sets GOMAXPROCS.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "abfs.pusher.name" . }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    {{- include "abfs.selectorLabels" "pusher" | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "abfs.pusher.name" . }}
  updatePolicy:
    updateMode: {{ $v.mode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: git-pusher
        controlledResources: ["memory"]
        minAllowed:
          memory: {{ $v.minMemory | quote }}
        maxAllowed:
          memory: {{ $v.maxMemory | quote }}
{{- end }}
