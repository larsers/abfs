# Helm chart for open-source ABFS on GKE Standard: the GCP-backed server behind an internal
# Gateway, the git-pushers, the bootstrap of the configs in the store, and the CI node
# setup (casfs loader, one cacheman per node, ComputeClasses). Google Cloud resources come
# from the KCC tree next to this chart and must exist before the install.
apiVersion: v2
name: abfs
description: Open-source ABFS server, git-pushers and CI node setup for GKE Standard
type: application
version: 0.1.0
appVersion: "0.1.23-oss"
# GKE 1.36.4-gke.1082000 or later (docs/prerequisites.md). Helm checks the version up to
# the patch level only, not the GKE build number.
kubeVersion: ">=1.36.4-0"
keywords:
  - abfs
  - android
  - build
