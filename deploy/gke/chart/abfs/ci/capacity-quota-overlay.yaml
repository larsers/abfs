# Overlay on seed-values.yaml: the CapacityQuota of the CI class with a node and a CPU
# limit. The GlobalRules object is named after the release and filtered to the cluster of
# alerts.clusterName in seed-values.yaml.
# expect: kind: CapacityQuota
# expect:       cloud.google.com/compute-class: abfs-ci
# expect:       nodes: 20
# expect:       cpu: 1280
# expect: kind: GlobalRules
# expect:   name: abfs-gke-metrics
# expect: cluster_name="abfs"
computeClasses:
  ci:
    capacityQuota:
      enabled: true
      nodes: 20
      cpu: 1280
