# Overlay on seed-values.yaml: the example build Job, with a command of more than one
# line.
ci:
  exampleJob:
    enabled: true
    image: europe-west4-docker.pkg.dev/example-project/ci/android-build@sha256:5555555555555555555555555555555555555555555555555555555555555555
    command: |
      source build/envsetup.sh
      lunch "$TARGET"
      m
