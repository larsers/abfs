# Test values: digests, a neutral backend and the seed phase.
image:
  server: {digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"}
  pusher: {digest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"}
  client: {digest: "sha256:3333333333333333333333333333333333333333333333333333333333333333"}
  casfsLoader: {digest: "sha256:4444444444444444444444444444444444444444444444444444444444444444"}
backend:
  project: example-project
  spannerInstance: abfs
  bigtableInstance: abfs-objects
  bucket: example-project-abfs-blobs
  zone: europe-west4-b
gateway:
  vip: 10.0.0.10
pusher:
  phase: seed
  pool:
    manifest:
      url: https://gerrit.example.com/a/platform/manifest
      project: platform/manifest
    overrides:
      - name: platform/manifest
        fetch-ref-spec: ["+refs/heads/*:refs/heads/*"]
computeClasses:
  nodeServiceAccount: abfs-nodes@example-project.iam.gserviceaccount.com
networkPolicy:
  proxyOnlySubnetCidr: 10.129.0.0/23
alerts:
  enabled: true
