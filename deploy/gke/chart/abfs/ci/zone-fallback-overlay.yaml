# Overlay on seed-values.yaml: a fallback zone list, Spot and a hand-made pool. The CI and
# server classes put the primary zone (backend.zone) first and the fallback zones, with
# locationPolicy ANY, after it; make template also checks the rule order.
# expect:         zones: ["europe-west4-b"]
# expect:         zones: ["europe-west4-a","europe-west4-c"]
# expect:         locationPolicy: ANY
computeClasses:
  zones:
    fallback: [europe-west4-a, europe-west4-c]
  ci:
    spot: true
    nodepools: [abfs-ci-iops]
