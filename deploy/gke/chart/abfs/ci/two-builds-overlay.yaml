# Overlay on seed-values.yaml: the boot disk that the cache reservation and two builds
# per node need (docs/ci-job.md, "Node disk"). The check counts one build, so 800Gi
# stands for two build pods of 400Gi.
# expect: bootDiskSize: 1600
ci:
  buildDisk: 800Gi
computeClasses:
  ci:
    bootDiskGb: 1600
