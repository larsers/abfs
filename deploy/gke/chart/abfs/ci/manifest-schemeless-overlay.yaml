# Overlay on seed-values.yaml: a manifest URL without a scheme. The pool adds https://,
# so the clients get the host and the path.
# expect-manifest: gerrit.example.com platform/manifest
pusher:
  pool:
    manifest:
      url: gerrit.example.com/platform/manifest
      project: ""
