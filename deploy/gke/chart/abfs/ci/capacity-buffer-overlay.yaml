# Overlay on seed-values.yaml: a standby buffer of 4 nodes on two machine types of at
# most 208 GB. The DaemonSets tolerate suspended standby nodes; the pod template has the
# shape of one build pod.
# expect: kind: CapacityBuffer
# expect:   provisioningStrategy: buffer.gke.io/standby-capacity
# expect:   replicas: 4
# expect:     buffer.gke.io/standby-capacity-init-time: "5m"
# expect:     buffer.gke.io/standby-capacity-refresh-frequency: "24h"
# expect: kind: PodTemplate
# expect:             ephemeral-storage: 400Gi
# expect:   - machineType: n4-standard-32
# expect:   - machineType: c4d-standard-32
# expect:         - key: buffer.gke.io/standby-capacity-node-suspended
ci:
  capacityBuffer:
    enabled: true
    replicas: 4
computeClasses:
  ci:
    machineTypes: [n4-standard-32, c4d-standard-32]
