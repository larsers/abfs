# Overlay on seed-values.yaml that must fail: condemn mode without the PodDisruptionBudget
# that --min-replicas assumes.
# expect-error: gcCollector.mode condemn needs pdb.enabled
server:
  gc:
    enabled: true
pdb:
  enabled: false
gcCollector:
  enabled: true
  mode: condemn
