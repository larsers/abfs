# Overlay on seed-values.yaml that must fail: a refresh period above 120h.
# expect-error: ci.capacityBuffer.refresh 168h is above 120h
ci:
  capacityBuffer:
    enabled: true
    replicas: 2
    refresh: 168h
computeClasses:
  ci:
    machineTypes: [n4-standard-32]
