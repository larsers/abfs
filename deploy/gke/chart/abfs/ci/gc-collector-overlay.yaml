# Overlay on seed-values.yaml: the garbage collector's CronJob in delete mode, with the
# alerts of seed-values.yaml.
# expect: name: abfs-gc-collector
# expect: timeZone: Etc/UTC
# expect: concurrencyPolicy: Forbid
# expect: startingDeadlineSeconds: 7200
# expect: successfulJobsHistoryLimit: 7
# expect: failedJobsHistoryLimit: 7
# expect: backoffLimit: 0
# expect: activeDeadlineSeconds: 14400
# expect: terminationGracePeriodSeconds: 90
# expect: - /usr/local/bin/abfs
# expect: - metrics-provider=otel
# expect: - record-client-metrics=true
# expect: - --project=example-project
# expect: - --bt-app-profile=abfs-gc
# expect: - --min-replicas=2
# expect: - --delete-types=commit,tag
# expect: value: abfs-gc
# expect: - alert: AbfsGcCycleNotClean
# expect: - alert: AbfsGcNoCleanCycle
# expect: absent_over_time(abfs_gc_cycle_end_timestamp_seconds{result="ok"}[31h])
server:
  gc:
    enabled: true
gcCollector:
  enabled: true
  mode: delete
  deleteTypes: [commit, tag]
