# Chart values of the smoke test (docs/install.md, steps 14 and 15). Pass this file last,
# after values.yaml and values-images.yaml. It points the pusher pool at the manifest host
# of docs/examples/smoke-manifest-host.yaml and runs the pushers in the steady phase,
# which is enough for two small projects. It replaces the manifest, branch files, fetch
# refspec and overrides of the real pool in values.yaml.
#
# The pool registers the manifest under the server
# abfs-smoke-manifest.abfs.svc.cluster.local:8080 and the project manifest, and the
# clients get the same two values. The manifest has the branch main, the default of
# ci.exampleJob.branch.
#
# Never pass this file once the smoke test is done: the real seed runs with
# pusher.phase seed and the pool of the real manifest from values.yaml.
pusher:
  phase: steady
  pool:
    manifest:
      url: http://abfs-smoke-manifest.abfs.svc.cluster.local:8080/manifest
      project: manifest
      server: ""
      checkInterval: ""
    branchFiles:
      - branch: main
        file: default.xml
    fetchRefSpec:
      - +refs/heads/*:refs/heads/*
      - +refs/tags/*:refs/tags/*
    overrides: []
