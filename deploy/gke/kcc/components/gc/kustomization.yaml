# Garbage collection, off by default. List it after backend-new to add the
# Bigtable table gc and the family objects:g; then run `abfs server gcp init
# --gc` for the Spanner tables, and set server.gc.enabled (docs/runbook.md,
# Garbage collection). It patches a backend-new object, so it does not build
# with backend-existing, where `init --gc` creates every GC resource.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - bigtable-gc.yaml
# Appends the family g to the families of the table objects, so that a family
# that backend-new adds later stays. Config Connector deletes a family of a
# table that the object does not list.
patches:
  - target: {group: bigtable.cnrm.cloud.google.com, kind: BigtableTable, name: abfs-table-objects}
    patch: |-
      - op: add
        path: /spec/columnFamily/-
        value: {family: g}
# The table gc and its policies go into the Bigtable instance of the table
# objects. The source exists only with backend-new, so the build fails with
# backend-existing.
replacements:
  - source: {kind: BigtableTable, name: abfs-table-objects, fieldPath: spec.instanceRef.name}
    targets:
      - select: {kind: BigtableTable, name: abfs-table-gc}
        fieldPaths: [spec.instanceRef.name]
      - select: {kind: BigtableGCPolicy, name: abfs-gc-policy-gc-e}
        fieldPaths: [spec.instanceRef.name]
      - select: {kind: BigtableGCPolicy, name: abfs-gc-policy-gc-t}
        fieldPaths: [spec.instanceRef.name]
      - select: {kind: BigtableGCPolicy, name: abfs-gc-policy-objects-g}
        fieldPaths: [spec.instanceRef.name]
