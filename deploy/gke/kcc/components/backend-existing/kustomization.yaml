# Mode "existing": no Config Connector object for the Spanner instance or
# database, the Bigtable instance or tables, or the bucket, so nothing here can
# change or delete them. Only the server's roles are granted. The backend must
# already have what `abfs server gcp init --gc` creates; running init again
# without changes is the check.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - iam.yaml
replacements:
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.project}
    targets:
      - select: {kind: IAMPolicyMember, name: abfs-server-spanner-database-user}
        fieldPaths: [spec.resourceRef.external]
        options: {delimiter: /, index: 1}
      - select: {kind: IAMPolicyMember, name: abfs-server-bigtable-user}
        fieldPaths: [spec.resourceRef.external]
        options: {delimiter: /, index: 1}
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.spannerInstance}
    targets:
      - select: {kind: IAMPolicyMember, name: abfs-server-spanner-database-user}
        fieldPaths: [spec.resourceRef.external]
        options: {delimiter: /, index: 3}
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.spannerDatabase}
    targets:
      - select: {kind: IAMPolicyMember, name: abfs-server-spanner-database-user}
        fieldPaths: [spec.resourceRef.external]
        options: {delimiter: /, index: 5}
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.bigtableInstance}
    targets:
      - select: {kind: IAMPolicyMember, name: abfs-server-bigtable-user}
        fieldPaths: [spec.resourceRef.external]
        options: {delimiter: /, index: 3}
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.bucket}
    targets:
      - select: {kind: IAMPolicyMember, name: abfs-server-storage-object-user}
        fieldPaths: [spec.resourceRef.external]
