# The three runtime roles of the server on a backend that Config Connector does
# not manage, named by external references:
#   SpannerDatabase   projects/<project>/instances/<instance>/databases/<db>
#   BigtableInstance  projects/<project>/instances/<instance>
#   StorageBucket     <bucket>
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: abfs-server-spanner-database-user
  namespace: abfs
spec:
  memberFrom:
    serviceAccountRef:
      name: abfs-server
  role: roles/spanner.databaseUser
  resourceRef:
    kind: SpannerDatabase
    external: projects/PROJECT_ID/instances/SPANNER_INSTANCE/databases/SPANNER_DATABASE
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: abfs-server-bigtable-user
  namespace: abfs
spec:
  memberFrom:
    serviceAccountRef:
      name: abfs-server
  role: roles/bigtable.user
  resourceRef:
    kind: BigtableInstance
    external: projects/PROJECT_ID/instances/BIGTABLE_INSTANCE
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: abfs-server-storage-object-user
  namespace: abfs
spec:
  memberFrom:
    serviceAccountRef:
      name: abfs-server
  role: roles/storage.objectUser
  resourceRef:
    kind: StorageBucket
    external: BUCKET
