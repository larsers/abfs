# Fills the placeholders of base from the overlay's ConfigMap abfs-kcc-settings.
# A base cannot read from its overlay, so this runs as a component of the
# overlay. The other components fill their own placeholders the same way.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.project}
    targets:
      - select: {kind: Namespace, name: abfs}
        fieldPaths:
          - metadata.annotations.[cnrm.cloud.google.com/project-id]
      - select: {kind: IAMPolicyMember, name: abfs-nodes-default-node-role}
        fieldPaths: [spec.resourceRef.external]
        options: {delimiter: /, index: 1}
      - select: {kind: IAMPolicyMember, name: abfs-nodes-artifact-reader}
        fieldPaths: [spec.resourceRef.external]
        options: {delimiter: /, index: 1}
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.kccServiceAccount}
    targets:
      - select: {kind: ConfigConnectorContext}
        fieldPaths: [spec.googleServiceAccount]
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.serverWorkloadIdentityMember}
    targets:
      - select: {kind: IAMPolicyMember, name: abfs-server-workload-identity}
        fieldPaths: [spec.member]
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.region}
    targets:
      - select: {kind: ComputeAddress, name: abfs-gateway}
        fieldPaths: [spec.location]
      - select: {kind: ComputeAddress, name: abfs-gateway}
        fieldPaths: [spec.subnetworkRef.external]
        options: {delimiter: /, index: 3}
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.networkProject}
    targets:
      - select: {kind: ComputeAddress, name: abfs-gateway}
        fieldPaths: [spec.subnetworkRef.external]
        options: {delimiter: /, index: 1}
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.subnetwork}
    targets:
      - select: {kind: ComputeAddress, name: abfs-gateway}
        fieldPaths: [spec.subnetworkRef.external]
        options: {delimiter: /, index: 5}
