# Optional: only for a network that has no proxy-only subnet in the region.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - subnetwork.yaml
replacements:
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.networkProject}
    targets:
      - select: {kind: ComputeSubnetwork, name: abfs-proxy-only}
        fieldPaths:
          - metadata.annotations.[cnrm.cloud.google.com/project-id]
      - select: {kind: ComputeSubnetwork, name: abfs-proxy-only}
        fieldPaths: [spec.networkRef.external]
        options: {delimiter: /, index: 1}
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.network}
    targets:
      - select: {kind: ComputeSubnetwork, name: abfs-proxy-only}
        fieldPaths: [spec.networkRef.external]
        options: {delimiter: /, index: 4}
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.proxySubnetRange}
    targets:
      - select: {kind: ComputeSubnetwork, name: abfs-proxy-only}
        fieldPaths: [spec.ipCidrRange]
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.region}
    targets:
      - select: {kind: ComputeSubnetwork, name: abfs-proxy-only}
        fieldPaths: [spec.region]
