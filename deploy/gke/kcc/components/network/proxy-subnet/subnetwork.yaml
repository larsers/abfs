# The proxy-only subnet that the internal Application Load Balancer of the
# Gateway needs, one per network and region. A /23 is recommended. Other load
# balancers of the region can come to use it, so it is abandoned on delete. In
# a Shared VPC it lives in the host project.
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: abfs-proxy-only
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/project-id: NETWORK_PROJECT
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  region: REGION
  ipCidrRange: PROXY_SUBNET_RANGE
  purpose: REGIONAL_MANAGED_PROXY
  role: ACTIVE
  networkRef:
    external: projects/NETWORK_PROJECT/global/networks/NETWORK
