# The blob store for the parts of large objects past the first 1 MiB. The
# location is set because the CRD default is US. The server never deletes
# objects, so soft delete would only add cost.
apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: abfs-blobs
  namespace: abfs
  labels:
    app: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
    cnrm.cloud.google.com/force-destroy: "false"
spec:
  resourceID: BUCKET
  location: REGION
  storageClass: STANDARD
  uniformBucketLevelAccess: true
  publicAccessPrevention: enforced
  softDeletePolicy:
    retentionDurationSeconds: 0
