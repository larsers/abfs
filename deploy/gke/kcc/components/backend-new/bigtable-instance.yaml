# One cluster: the server needs single-cluster routing. Autoscaling between
# minNodes and maxNodes, the cost cap; patch maxNodes in the overlay.
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableInstance
metadata:
  name: abfs-objects
  namespace: abfs
  labels:
    app: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: BIGTABLE_INSTANCE
  displayName: ABFS objects
  cluster:
    - clusterId: BIGTABLE_CLUSTER
      zone: ZONE
      storageType: SSD
      autoscalingConfig:
        minNodes: 1
        maxNodes: 3
        cpuTarget: 60
