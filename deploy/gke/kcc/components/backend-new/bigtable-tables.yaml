# The tables and column families of `abfs server gcp init --gc`. The gc table
# and the family objects:g are created always; a server without --gc ignores
# them. Each family keeps one version, as init sets it.
---
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableTable
metadata:
  name: abfs-table-objects
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: objects
  instanceRef:
    name: abfs-objects
  columnFamily:
    - family: meta
    - family: data
    - family: g
---
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableTable
metadata:
  name: abfs-table-maps
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: maps
  instanceRef:
    name: abfs-objects
  columnFamily:
    - family: cf
---
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableTable
metadata:
  name: abfs-table-chunks
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: chunks
  instanceRef:
    name: abfs-objects
  columnFamily:
    - family: data
---
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableTable
metadata:
  name: abfs-table-gc
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: gc
  instanceRef:
    name: abfs-objects
  columnFamily:
    - family: e
    - family: t
---
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableGCPolicy
metadata:
  name: abfs-gc-policy-objects-meta
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  instanceRef:
    name: abfs-objects
  tableRef:
    name: abfs-table-objects
  columnFamily: meta
  maxVersion:
    - number: 1
  deletionPolicy: ABANDON
---
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableGCPolicy
metadata:
  name: abfs-gc-policy-objects-data
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  instanceRef:
    name: abfs-objects
  tableRef:
    name: abfs-table-objects
  columnFamily: data
  maxVersion:
    - number: 1
  deletionPolicy: ABANDON
---
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableGCPolicy
metadata:
  name: abfs-gc-policy-objects-g
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  instanceRef:
    name: abfs-objects
  tableRef:
    name: abfs-table-objects
  columnFamily: g
  maxVersion:
    - number: 1
  deletionPolicy: ABANDON
---
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableGCPolicy
metadata:
  name: abfs-gc-policy-maps-cf
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  instanceRef:
    name: abfs-objects
  tableRef:
    name: abfs-table-maps
  columnFamily: cf
  maxVersion:
    - number: 1
  deletionPolicy: ABANDON
---
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableGCPolicy
metadata:
  name: abfs-gc-policy-chunks-data
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  instanceRef:
    name: abfs-objects
  tableRef:
    name: abfs-table-chunks
  columnFamily: data
  maxVersion:
    - number: 1
  deletionPolicy: ABANDON
---
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableGCPolicy
metadata:
  name: abfs-gc-policy-gc-e
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  instanceRef:
    name: abfs-objects
  tableRef:
    name: abfs-table-gc
  columnFamily: e
  maxVersion:
    - number: 1
  deletionPolicy: ABANDON
---
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableGCPolicy
metadata:
  name: abfs-gc-policy-gc-t
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  instanceRef:
    name: abfs-objects
  tableRef:
    name: abfs-table-gc
  columnFamily: t
  maxVersion:
    - number: 1
  deletionPolicy: ABANDON
