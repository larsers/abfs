# Mode "new": Config Connector creates the backend, schema included. Use it
# only for resources that do not exist yet: adopting a live Bigtable instance
# or table can delete clusters and column families, and the ddl list is sent
# again. For a backend that exists, use backend-existing.
#
# Every data resource carries deletion-policy abandon, so deleting the objects
# keeps the data; remove the resources by hand when they are no longer needed.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - spanner.yaml
  - bigtable-instance.yaml
  - bigtable-tables.yaml
  - storage.yaml
  - iam.yaml
patches:
  - path: spanner-database-ddl.yaml
replacements:
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.region}
    targets:
      - select: {kind: SpannerInstance, name: abfs-refs}
        fieldPaths: [spec.config]
        options: {delimiter: regional-, index: 1}
      - select: {kind: StorageBucket, name: abfs-blobs}
        fieldPaths: [spec.location]
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.zone}
    targets:
      - select: {kind: BigtableInstance, name: abfs-objects}
        fieldPaths: [spec.cluster.0.zone]
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.spannerInstance}
    targets:
      - select: {kind: SpannerInstance, name: abfs-refs}
        fieldPaths: [spec.resourceID]
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.spannerDatabase}
    targets:
      - select: {kind: SpannerDatabase, name: abfs-cas}
        fieldPaths: [spec.resourceID]
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.bigtableInstance}
    targets:
      - select: {kind: BigtableInstance, name: abfs-objects}
        fieldPaths: [spec.resourceID]
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.bigtableCluster}
    targets:
      - select: {kind: BigtableInstance, name: abfs-objects}
        fieldPaths: [spec.cluster.0.clusterId]
  - source: {kind: ConfigMap, name: abfs-kcc-settings, fieldPath: data.bucket}
    targets:
      - select: {kind: StorageBucket, name: abfs-blobs}
        fieldPaths: [spec.resourceID]
