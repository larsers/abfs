# Written by scripts/gen-ddl.sh from the GCP server schema file
# casdb/schema.sql of the release that first created the database. The
# garbage collector tables are not in the list: `abfs server gcp init --gc`
# adds them when GC is turned on (docs/runbook.md, Garbage collection). Never
# edit or remove an entry: Config Connector sends only the entries past the
# old list length and refuses a changed one. A later schema change is a new
# ALTER or CREATE ... IF NOT EXISTS entry appended at the end, in the same
# "- |-" form. The base line is the sha256 of the first entries;
# scripts/check-ddl.sh checks the list against it.
# ddl-base: sha256:438c4accfbca92785578b6c04a1f7b4180234cfee2ab39f2bbe3f5ff4bbb2484 5 entries
apiVersion: spanner.cnrm.cloud.google.com/v1beta1
kind: SpannerDatabase
metadata:
  name: abfs-cas
  namespace: abfs
spec:
  ddl:
    - |-
      CREATE SEQUENCE IF NOT EXISTS ProjectIdSequence OPTIONS (sequence_kind="bit_reversed_positive")
    - |-
      CREATE TABLE IF NOT EXISTS Projects (
          ProjectId INT64 DEFAULT (GET_NEXT_SEQUENCE_VALUE(SEQUENCE ProjectIdSequence)),
          Host STRING(MAX) NOT NULL,
          Project STRING(MAX) NOT NULL,
      ) PRIMARY KEY (ProjectId)
    - |-
      CREATE UNIQUE INDEX IF NOT EXISTS ProjectsIndex ON Projects(Host, Project)
    - |-
      CREATE TABLE IF NOT EXISTS Refs (
          ProjectId INT64 NOT NULL,
          Ref STRING(MAX) NOT NULL,
          UpdateTime TIMESTAMP NOT NULL,
          Target STRING(128),
          CONSTRAINT FK_Refs_ProjectId FOREIGN KEY (ProjectId) REFERENCES Projects (ProjectId),
      ) PRIMARY KEY (ProjectId, Ref)
    - |-
      CREATE INDEX IF NOT EXISTS RefsRefIndex ON Refs(Ref)
