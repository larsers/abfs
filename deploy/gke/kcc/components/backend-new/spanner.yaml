# Spanner holds projects and refs only, so 100 processing units are enough.
# A new instance gets Spanner's default automated daily backups; delete the
# backups before deleting the instance (docs/runbook.md, Teardown).
# spec.labels needs Config Connector 1.130.1 or later; older versions refuse
# the object with a strict decoding error.
apiVersion: spanner.cnrm.cloud.google.com/v1beta1
kind: SpannerInstance
metadata:
  name: abfs-refs
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: SPANNER_INSTANCE
  config: regional-REGION
  displayName: ABFS refs
  processingUnits: 100
  labels:
    app: abfs
---
# The ddl list is in spanner-database-ddl.yaml, written by scripts/gen-ddl.sh.
apiVersion: spanner.cnrm.cloud.google.com/v1beta1
kind: SpannerDatabase
metadata:
  name: abfs-cas
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: SPANNER_DATABASE
  instanceRef:
    name: abfs-refs
  databaseDialect: GOOGLE_STANDARD_SQL
