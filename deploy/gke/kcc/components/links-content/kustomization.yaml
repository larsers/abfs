# Opt-in, with the chart value server.linksContent.enabled: the server returns
# large objects as signed Cloud Storage URLs and signs them as its own service
# account, which needs iam.serviceAccounts.signBlob on itself. Works with both
# backend modes. Signing counts against the IAM quota for signBlob requests,
# 60,000 per project per minute.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - iam.yaml
