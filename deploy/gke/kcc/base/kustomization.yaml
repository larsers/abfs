# Objects of both backend modes. The upper-case words are placeholders that the
# component settings fills from the overlay's settings.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configconnectorcontext.yaml
  - services.yaml
  - server-service-account.yaml
  - node-service-account.yaml
  - gateway-address.yaml
