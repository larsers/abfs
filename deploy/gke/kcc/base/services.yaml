# The APIs of the deployment. serviceusage and cloudresourcemanager must be
# enabled by hand before Config Connector can reconcile these. Abandon keeps an
# API enabled when its object is deleted.
---
apiVersion: serviceusage.cnrm.cloud.google.com/v1beta1
kind: Service
metadata:
  name: compute.googleapis.com
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: compute.googleapis.com
---
