# The Google identity of the ABFS server, the only workload that holds Google
# roles. The Kubernetes service account abfs/abfs-server of the chart acts as
# this account through Workload Identity. Its runtime roles on the backend are
# granted by the component backend-new or backend-existing.
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: abfs-server
  namespace: abfs
spec:
  displayName: ABFS server
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: abfs-server-workload-identity
  namespace: abfs
spec:
  member: SERVER_WORKLOAD_IDENTITY_MEMBER
  role: roles/iam.workloadIdentityUser
  resourceRef:
    kind: IAMServiceAccount
    name: abfs-server
