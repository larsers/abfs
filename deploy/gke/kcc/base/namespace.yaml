# The namespace holds the Config Connector objects and the server side of the
# chart (server, pushers, bootstrap Job). Config Connector creates the Google
# Cloud resources of this namespace in the project named by the annotation.
# The pushers run as root, which the baseline level allows.
apiVersion: v1
kind: Namespace
metadata:
  name: abfs
  annotations:
    cnrm.cloud.google.com/project-id: PROJECT_ID
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
