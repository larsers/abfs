# The internal address of the Gateway (gke-l7-rilb). The chart names it in
# gateway.addressName; CI pods and pushers reach the server at <address>:50051.
# The subnetwork is the cluster's, not the proxy-only subnet. The IP is in the
# client configs of every pusher and CI node, so deleting the object keeps the
# address (abandon); a new address would get another IP.
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeAddress
metadata:
  name: abfs-gateway
  namespace: abfs
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  location: REGION
  addressType: INTERNAL
  purpose: SHARED_LOADBALANCER_VIP
  subnetworkRef:
    external: projects/NETWORK_PROJECT/regions/REGION/subnetworks/SUBNETWORK
