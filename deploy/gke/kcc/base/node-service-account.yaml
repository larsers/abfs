# The node service account of the ComputeClasses (nodePoolConfig.serviceAccount
# = abfs-nodes@<project>.iam.gserviceaccount.com). GKE nodes need the default
# node role; the reader role pulls the ABFS images. When the Artifact Registry
# repository is in another project, grant the reader role there instead.
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: abfs-nodes
  namespace: abfs
spec:
  displayName: ABFS GKE nodes
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: abfs-nodes-default-node-role
  namespace: abfs
spec:
  memberFrom:
    serviceAccountRef:
      name: abfs-nodes
  role: roles/container.defaultNodeServiceAccount
  resourceRef:
    kind: Project
    external: projects/PROJECT_ID
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: abfs-nodes-artifact-reader
  namespace: abfs
spec:
  memberFrom:
    serviceAccountRef:
      name: abfs-nodes
  role: roles/artifactregistry.reader
  resourceRef:
    kind: Project
    external: projects/PROJECT_ID
