# Namespaced mode: Config Connector reconciles the objects of the namespace abfs
# as this Google service account. The Config Connector operator (manual install,
# 1.130.1 or later, ConfigConnector in mode namespaced), the account and its
# Workload Identity binding to cnrm-system/cnrm-controller-manager-abfs are
# prerequisites (docs/prerequisites.md). Never delete this object while
# Config Connector objects exist in the namespace.
apiVersion: core.cnrm.cloud.google.com/v1beta1
kind: ConfigConnectorContext
metadata:
  name: configconnectorcontext.core.cnrm.cloud.google.com
  namespace: abfs
spec:
  googleServiceAccount: KCC_SERVICE_ACCOUNT
  stateIntoSpec: Absent
