# Worked example. Copy this directory, set settings.yaml, and pick the
# components:
#   - the backend mode: exactly one of backend-new (Config Connector creates
#     Spanner, Bigtable and the bucket) and backend-existing (they exist; only
#     the server's roles are granted). Listing both fails the build.
#   - network/proxy-subnet when the network has no proxy-only subnet in the
#     region.
#   - gc, after backend-new, only when garbage collection is turned on
#     (docs/runbook.md, Garbage collection). Off by default.
#   - settings, always.
# Render with `kubectl kustomize`, apply with `kubectl apply -k`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - settings.yaml
components:
  - ../../components/backend-new
  # - ../../components/backend-existing
  # - ../../components/network/proxy-subnet
  # - ../../components/gc
  - ../../components/settings
# Numbers cannot come from settings.yaml (its values are strings), so set them
# with a patch. Example for backend-new, the Bigtable cost cap:
# patches:
#   - target: {kind: BigtableInstance, name: abfs-objects}
#     patch: |-
#       - op: replace
#         path: /spec/cluster/0/autoscalingConfig/maxNodes
#         value: 5
